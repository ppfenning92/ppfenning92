# yaml-language-server: $schema=https://raw.githubusercontent.com/asamarts/alint/main/schemas/v1/config.json
#
# Baseline policy is owned centrally in ptrck-sh/templates/project-template-default
# and pulled in here, pinned by ref + SRI hash (Renovate bumps the ref; a
# postUpgradeTask re-pins the #sha256). Plain config repo — base policy only.

version: 1

extends:
  # Bundled rulesets are referenced locally (a remote policy may not nest these).
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/hygiene/lockfiles@v1
  - alint://bundled/agent-hygiene@v1
  - alint://bundled/agent-context@v1

  # renovate: datasource=gitlab-tags depName=ptrck-sh/templates/project-template-default
  - https://gitlab.com/ptrck-sh/templates/project-template-default/-/raw/1.1.1/.alint/base.yml#sha256-dd2c733ff2917c7576333dc35eeee140f9c0661d9aa6725aae783f07a30af690
